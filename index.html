<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6A13"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>html{padding:0}body{margin:0;font:14px/1.45 system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}:root{color-scheme:light}</style>
<title>EasyGo Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: orange hero on Beranda, one content column (max 1080px) on every other page, kanban that scrolls sideways, floating dark nav pinned to the bottom. */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --chip:#EDEFF3; --line:#E6E8EE;
  --ink:#1B1E25; --ink-2:#5B6273; --ink-3:#8A91A2;
  --brand:#F26A0E; --brand-hi:#FF8A1F; --brand-lo:#F05A00; --brand-tint:#FFE9DC; --brand-ink:#D94F0E;
  --dark:#1C1F26; --on-dark:#FFFFFF; --nav:#1C1F26; --nav-ink:#AEB4C2;
  --komp-tint:#E4E8F4; --komp-ink:#34405E; --rail:#98A0B3;
  --ok-bg:#DDF3E4; --ok-ink:#1D6B3A;
  --danger:#C23A2B; --shadow:0 6px 18px rgba(20,24,40,.07); --overlay:rgba(12,14,20,.5);
  --gutter:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --surface:#1A1D24; --surface-2:#20242C; --chip:#2A2F3A; --line:#2B303A;
    --ink:#F1F2F5; --ink-2:#A8AFBF; --ink-3:#7E8597;
    --brand:#F7742A; --brand-tint:#3B2517; --brand-ink:#FF9A5C;
    --dark:#0D0E12; --nav:#262A33; --nav-ink:#9CA3B4;
    --komp-tint:#262D44; --komp-ink:#B7C3EA; --rail:#566074;
    --ok-bg:#16301F; --ok-ink:#7FD39B; --danger:#FF7A6B; --shadow:0 6px 18px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#1A1D24; --surface-2:#20242C; --chip:#2A2F3A; --line:#2B303A;
  --ink:#F1F2F5; --ink-2:#A8AFBF; --ink-3:#7E8597;
  --brand:#F7742A; --brand-tint:#3B2517; --brand-ink:#FF9A5C;
  --dark:#0D0E12; --nav:#262A33; --nav-ink:#9CA3B4;
  --komp-tint:#262D44; --komp-ink:#B7C3EA; --rail:#566074;
  --ok-bg:#16301F; --ok-ink:#7FD39B; --danger:#FF7A6B; --shadow:0 6px 18px rgba(0,0,0,.35); --overlay:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:var(--gutter);padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{padding-block:18px 190px}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:26px 0 12px}
.num{font-variant-numeric:tabular-nums}

/* Header: judul halaman, notifikasi, akun */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.pt{flex:1;min-width:0;font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:9px;flex:0 1 auto;min-width:0;max-width:210px;padding:4px 14px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);text-align:left}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand-hi),var(--brand-lo));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.av.lg{width:56px;height:56px;font-size:20px}
.me-t{min-width:0;line-height:1.2}
.me-t b,.me-t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-t b{font-size:13.5px;font-weight:700}
.me-t span{font-size:11.5px;color:var(--ink-2)}
@media (max-width:440px){.me-t span{display:none}.me{max-width:150px}.pt{font-size:18px}}
.nlist{display:flex;flex-direction:column;gap:10px}
.nitem{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.nitem.unread{border-color:var(--brand);background:var(--brand-tint)}
.nitem strong{display:block;font-size:15px;font-weight:700;margin-top:7px;overflow-wrap:anywhere}
.nitem .meta{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.ntag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--ink-2)}
.ntag.warn{background:var(--brand-tint);color:var(--brand-ink)}
.nitem.unread .ntag.warn{background:var(--surface)}
.ntag.ok{background:var(--ok-bg);color:var(--ok-ink)}
.ntag.info{background:var(--komp-tint);color:var(--komp-ink)}
.acct{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.acct b{display:block;font-size:17px;font-weight:800}
.acct .meta{color:var(--ink-2);font-size:13.5px;overflow-wrap:anywhere}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:30px 24px;width:min(420px,100%);text-align:center;display:flex;flex-direction:column;gap:14px}
.gcard img{width:180px;max-width:70%;margin:0 auto;background:#fff;border-radius:14px;padding:10px 14px}
.gcard h1{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.gcard p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.55}
.gcard form{text-align:left;display:flex;flex-direction:column;gap:2px}
.gcard form .sheet-actions{margin-top:14px}
.gcard.login{padding:22px 20px 20px;gap:10px;width:min(340px,100%);text-align:left}
.gcard.login img{width:128px;max-width:60%;padding:0;margin:0 auto 2px;border-radius:0;background:none}
.gcard.login h1{text-align:center;font-size:17px;margin:0 0 6px;color:var(--ink-2);font-weight:700;letter-spacing:0}
.gcard.login .gmsg{text-align:center;font-size:13px;line-height:1.4}
.gcard.login .lf input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:15px;outline:none}
.gcard.login .lf input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.gcard.login .note{margin:0;font-size:13px;padding:8px 12px}
.gcard.login .btn{height:44px;width:100%;justify-content:center;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gated .top,.gated .nav,.gated .fab-wrap{display:none}

/* Hero (Beranda) */
.hero{background:linear-gradient(135deg,var(--brand-hi),var(--brand-lo));border-radius:0 0 40px 40px;padding-block:18px 20px}
.greet{background:var(--dark);color:var(--on-dark);border-radius:26px;padding:22px 22px 24px}
.greet small{display:block;font-size:12.5px;opacity:.72}
.greet h1{font-size:27px;line-height:1.18;font-weight:400;margin:8px 0 0;letter-spacing:-.01em}
.greet h1 b{font-weight:800}

/* Menu tiles */
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mtile{position:relative;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);min-height:112px;padding:14px;text-align:left;display:flex;align-items:flex-end;font-weight:700;font-size:15px;border:1px solid var(--line)}
.mtile i{position:absolute;top:12px;right:12px;width:32px;height:32px;border:2px solid var(--brand);border-radius:50%;color:var(--brand);display:grid;place-items:center;font-style:normal;font-size:13px;line-height:1}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:stretch}
.weeknav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:232px;flex:0 1 244px}
.weeknav .wn-b{width:38px;align-self:stretch;font-size:20px;color:var(--ink-2)}
.wn-t{flex:1;text-align:center;line-height:1.2;padding:7px 0;min-width:0}
.wn-t strong{display:block;font-size:15px;font-weight:700}
.wn-t span{font-size:12.5px;color:var(--ink-2)}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px;font-weight:600;font-size:15px;min-height:44px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg-i{padding:9px 15px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.seg-i.on{background:var(--dark);color:var(--on-dark)}
.subchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
.sc.on{background:var(--brand-tint);color:var(--brand-ink);border-color:var(--brand)}
.toolbar + .subchips{margin-top:10px}
.range{margin-top:10px}

/* Stat grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:16px}
.stat{background:var(--surface);padding:16px 18px 18px;min-width:0}
.stat b{display:block;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:4px}
@media (min-width:720px){.stats{grid-template-columns:repeat(3,1fr)}.menu{grid-template-columns:repeat(6,1fr)}}

/* Kanban */
.board{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;margin:22px calc(-1*var(--gutter)) 0;padding-bottom:16px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 clamp(270px,76vw,340px);scroll-snap-align:start;min-width:0}
.col:last-child{margin-right:var(--gutter)}
.col-h{display:grid;grid-template-columns:1fr auto;align-items:baseline;border-bottom:3px solid var(--rail);padding:0 2px 10px}
.col-h h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.col-h .n{font-size:15px;color:var(--ink-3);font-weight:600}
.col-h .v{grid-column:1/-1;font-size:14px;color:var(--ink-3);font-weight:500}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.card.hot{border-color:var(--brand);border-left-width:4px}
.card strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .meta{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.chip{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.tms{background:var(--brand-tint);color:var(--brand-ink)}
.chip.komp{background:var(--komp-tint);color:var(--komp-ink)}
.none{color:var(--ink-3);font-size:13px;padding:6px 2px}

/* Activity list */
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:16px}
.group + .group{margin-top:14px}
.day{background:var(--surface-2);padding:13px 18px;font-weight:700;color:var(--ink-2);font-size:15px}
.arow{display:block;width:100%;text-align:left;padding:15px 18px;border-top:1px solid var(--line);position:relative}
.arow strong{display:block;font-size:16px;font-weight:700;padding-right:64px;letter-spacing:-.01em;overflow-wrap:anywhere}
.arow .meta{color:var(--ink-2);font-size:14px;margin-top:2px}
.arow .hapus{position:absolute;top:14px;right:16px;font-size:14px;color:var(--ink-3);padding:2px 4px}
.arow .hapus.ask{color:var(--danger);font-weight:700}

/* Leads */
.searchrow{display:flex;gap:12px;margin-top:16px}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 20px;font-weight:700;font-size:15px;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:7px 14px;font-size:13.5px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:14px}
.lrow{margin-top:8px;font-size:14.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.lrow b{color:var(--ink);font-weight:600}
.lrow a{color:var(--brand);font-weight:700}
.lcard .head{font-size:14.5px;color:var(--ink-2)}
.lcard .head b{display:block;font-size:18px;color:var(--ink);font-weight:800;letter-spacing:-.01em;margin-top:2px}
.lcard .acts{display:flex;gap:8px;margin-top:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:26px 20px;text-align:center;color:var(--ink-2);margin-top:16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.note{margin-top:12px;font-size:13px;color:var(--ink-2);background:var(--brand-tint);border-radius:12px;padding:10px 14px}

/* Laporan */
.exports{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 22px;margin-top:16px}
.report h3.t{margin:0;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.report .sub{color:var(--ink-2);font-size:15px;margin-top:4px}
.report .stats{margin-top:18px}
.report p{font-size:15px;line-height:1.6;margin:18px 0 0}
.report h4{margin:24px 0 8px;font-size:15px;font-weight:800}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;min-width:420px;font-size:13.5px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:700;color:var(--ink-2);padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}

/* Floating controls */
.fab-wrap{position:fixed;left:50%;transform:translateX(-50%);width:min(1080px,100%);bottom:calc(22px + 58px + 14px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:flex-end;pointer-events:none;z-index:20}
.fab{pointer-events:auto;background:var(--brand);color:#fff;border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(240,90,0,.35)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 18px));height:58px;background:var(--nav);border-radius:36px;display:flex;justify-content:space-around;align-items:center;z-index:30;box-shadow:0 12px 28px rgba(10,12,20,.28)}
.nav button{position:relative;flex:1;height:100%;color:var(--nav-ink);font-weight:600;font-size:13.5px;padding-top:6px}
.nav button.on{color:var(--brand-hi)}
.nav button.on::before{content:"";position:absolute;left:50%;top:9px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--brand-hi)}

/* Sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:28px}}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two > *{min-width:0}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sheet-actions .grow{flex:1}
.choice{display:flex;flex-direction:column;gap:10px}
.choice .btn{justify-content:flex-start;padding:16px 18px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + 58px + 74px + env(safe-area-inset-bottom,0px));background:var(--dark);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}}
</style>

</head><body>
<header class="top" id="top"></header>
<div id="view"></div>
<div class="fab-wrap" id="fabwrap" hidden><button type="button" class="fab" data-act="fab">+ Tambah data</button></div>
<nav class="nav" aria-label="Menu utama">
  <button type="button" data-act="go" data-v="beranda" data-nav="beranda">Beranda</button>
  <button type="button" data-act="go" data-v="pipeline" data-nav="pipeline">Pipeline</button>
  <button type="button" data-act="go" data-v="aktivitas" data-nav="aktivitas">Aktivitas</button>
  <button type="button" data-act="go" data-v="leads" data-nav="leads">Leads</button>
  <button type="button" data-act="go" data-v="laporan" data-nav="laporan">Laporan</button>
</nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function dShort(s){if(!s)return '';var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]}
function dLong(s){var d=parse(s);return DAYS_L[d.getDay()]+', '+d.getDate()+' '+MONTHS_L[d.getMonth()]}
function nfmt(n){n=Math.round(n*10)/10;return String(n).replace('.',',')}
function rpChip(v){v=+v||0;return v>=1000?'Rp'+nfmt(v/1000)+'M':'Rp'+nfmt(v)+'jt'}
function rpStat(v){v=+v||0;return v>=1000?'Rp'+nfmt(v/1000)+' M':'Rp'+nfmt(v)+' jt'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function key(s){return String(s||'').trim().toLowerCase()}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function weekLabel(w){var e=addDays(w,6);return w.getDate()+' '+MONTHS[w.getMonth()]+' – '+e.getDate()+' '+MONTHS[e.getMonth()]+' '+e.getFullYear()}
function weekRange(w){return [iso(w),iso(addDays(w,6))]}
function chipClass(p){return p==='Kompetitor'?'komp':'tms'}

/* ---------- platform: Cloudflare (login + proxy /api ke Apps Script + Google Sheet) ---------- */
var P=(function(){
  var h=null,pending=0,timer=null,lastSig='',wired=false;
  var api={kind:'cf',mode:'gas',sheetUrl:'',reportSheet:null,
    account:{note:'Nama dan jabatan tersimpan di sheet Pengguna pada Google Sheet Anda.',switchUrl:''}};
  function post(path,body){
    return fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
      .then(function(r){
        return r.json().catch(function(){return {ok:false,message:'Jawaban server tidak dikenal.'}})
          .then(function(j){j._status=r.status;return j});
      });
  }
  function expired(){
    if(h)h.denied({form:true,message:'Sesi berakhir. Silakan masuk lagi.'});
  }
  function call(fn,args){
    return post('/api/call',{fn:fn,args:args||[]}).then(function(j){
      if(j._status===401){expired();var e=new Error('Sesi berakhir. Masuk lagi.');e.code='unauth';throw e}
      if(!j.ok)throw new Error(j.message||'Permintaan gagal.');
      return j.result;
    });
  }
  function tracked(p){pending++;return p.then(function(r){pending--;return r},function(e){pending--;throw e})}
  function apply(d){
    var sig=JSON.stringify([d.leads,d.activities]);
    if(sig===lastSig)return;
    lastSig=sig;h.data(d.leads,d.activities);
  }
  api.defaultMe=function(){return {name:'Pengguna',role:'Account Manager',email:'',first:false}};
  api.reload=function(){
    if(pending>0)return Promise.resolve();
    return call('getData').then(apply,function(){});
  };
  api.start=function(handlers){
    h=handlers;
    fetch('/api/session',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(s){
      if(s.configured===false){h.denied({form:false,message:s.message||'Server belum diatur lengkap. Periksa variabel di Cloudflare.'});return}
      if(!s.user){h.denied({form:true,message:'Masuk dengan nama pengguna dan kata sandi Anda.'});return}
      return call('bootstrap').then(function(r){
        api.sheetUrl=r.sheetUrl||'';
        h.me(r.me);apply(r);
        clearInterval(timer);
        timer=setInterval(function(){if(!document.hidden)api.reload()},30000);
        if(!wired){wired=true;document.addEventListener('visibilitychange',function(){if(!document.hidden)api.reload()})}
      });
    }).catch(function(e){
      if(e&&e.code==='unauth')return;
      h.denied({form:false,message:'Tidak bisa terhubung ke server: '+((e&&e.message)||'coba lagi sebentar lagi.')});
    });
  };
  api.login=function(user,pass){
    return post('/api/login',{user:user,pass:pass}).then(function(j){
      if(!j.ok)throw new Error(j.message||'Nama pengguna atau kata sandi salah.');
    });
  };
  api.logout=function(){
    clearInterval(timer);lastSig='';
    return post('/api/logout',{});
  };
  api.put=function(col,id,rec){return tracked(call('saveRecord',[col,rec]))};
  api.delMany=function(col,ids){return tracked(call('deleteRecords',[col,ids]))};
  api.saveProfile=function(p){return call('saveProfile',[p])};
  var MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf'};
  api.save=function(filename,data){
    return new Promise(function(res){
      try{
        var ext=String(filename).split('.').pop();
        var blob=new Blob([data],{type:MIME[ext]||'application/octet-stream'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url;a.download=filename;a.style.display='none';
        document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(url);a.remove()},4000);
        toast('File diunduh: '+filename);
      }catch(e){toast('Unduhan gagal. Coba lagi.')}
      res();
    });
  };
  return api;
})();

var S={leads:[],acts:[],ready:false,slow:false,err:'',auth:'loading',gate:null,me:P.defaultMe(),view:'beranda',week:mondayOf(new Date()),seg:'semua',sub:'all',range:'minggu',q:'',askDel:null};
var LS_KEY='easygo_pipeline_v1';

function segOk(p){
  if(S.seg==='semua')return true;
  if(S.seg==='kompetitor')return p==='Kompetitor';
  if(String(p).indexOf('TMS')!==0)return false;
  if(S.sub==='enterprise')return p==='TMS Enterprise';
  if(S.sub==='lite')return p==='TMS Lite';
  return true;
}
function segLabel(){
  if(S.seg==='semua')return 'Semua segmen';
  if(S.seg==='kompetitor')return 'Kompetitor';
  return S.sub==='enterprise'?'TMS Enterprise':S.sub==='lite'?'TMS Lite':'TMS (Enterprise & Lite)';
}
function leadOf(a){
  for(var i=0;i<S.leads.length;i++){if(S.leads[i].id===a.leadId)return S.leads[i]}
  for(var j=0;j<S.leads.length;j++){if(key(S.leads[j].company)===key(a.company))return S.leads[j]}
  return null;
}
function calc(range,pred){
  var a=range[0],b=range[1];
  var acts=S.acts.filter(function(x){return x.date>=a&&x.date<=b&&pred(x.produk)});
  var comp={};acts.forEach(function(x){comp[key(x.company)]=1});
  var kd=acts.filter(function(x){return x.type==='Kunjungan'||x.type==='Demo'}).length;
  var pw=acts.filter(function(x){return x.type==='Penawaran'}).length;
  var lb=S.leads.filter(function(l){return l.enteredAt>=a&&l.enteredAt<=b&&pred(l.produk)}).length;
  var nv={};
  acts.forEach(function(x){if(x.stage==='Penawaran'||x.stage==='Negosiasi'){var l=leadOf(x);nv[key(x.company)]=l?(+l.value||0):0}});
  var nilai=0;Object.keys(nv).forEach(function(k){nilai+=nv[k]});
  return {acts:acts,aktivitas:acts.length,perusahaan:Object.keys(comp).length,kd:kd,pw:pw,lb:lb,nilai:nilai};
}
function sortActs(list){return list.slice().sort(function(x,y){return y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0)})}

/* ---------- data layer ---------- */
function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({leads:S.leads,acts:S.acts}))}catch(e){}}
function loadLocal(){try{var j=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(j){S.leads=j.leads||[];S.acts=j.acts||[]}}catch(e){}}
function strip(rec){var o={};Object.keys(rec).forEach(function(k){if(k!=='id')o[k]=rec[k]});return o}
var H={
  data:function(l,a){S.leads=l;S.acts=a;S.ready=true;S.slow=false;S.err='';S.auth='ok';render()},
  me:function(m){S.me=Object.assign({},S.me,m);render()},
  error:function(code){S.err=code||'unavailable';S.ready=true;render()},
  slow:function(){if(!S.ready){S.slow=true;render()}},
  local:function(){loadLocal();S.ready=true;S.auth='ok';render()},
  denied:function(info){S.auth='denied';S.gate=info||{};S.ready=true;render()}
};
async function putDoc(col,id,rec){
  rec=strip(rec);
  if(P.mode==='db'){await P.put(col,id,rec);return}
  var arr=col==='leads'?S.leads:S.acts;var full=Object.assign({id:id},rec);
  var i=arr.findIndex(function(x){return x.id===id});
  if(i>=0)arr[i]=full;else arr.push(full);
  render();
  if(P.mode==='gas'){try{await P.put(col,id,full)}catch(e){P.reload();throw e}}
  else persistLocal();
}
async function delDocs(col,ids){
  if(P.mode==='db'){await P.delMany(col,ids);return}
  var set={};ids.forEach(function(i){set[i]=1});
  if(col==='leads')S.leads=S.leads.filter(function(x){return !set[x.id]});
  else S.acts=S.acts.filter(function(x){return !set[x.id]});
  render();
  if(P.mode==='gas'){try{await P.delMany(col,ids)}catch(e){P.reload();throw e}}
  else persistLocal();
}
function delDoc(col,id){return delDocs(col,[id])}
function writeFail(e){
  var c=e&&e.code;
  var msg=c==='invalid_argument'?'Anda tidak punya izin mengubah data ini.':c==='quota_exceeded'?'Penyimpanan penuh. Hapus data lama dulu.':(P.kind==='gas'&&e&&e.message?'Gagal menyimpan: '+String(e.message).slice(0,90):'Data belum tersimpan. Coba lagi.');
  toast(msg);
}

function markRead(ids){

  try{var j=JSON.parse(localStorage.getItem(READ_KEY)||'{}');ids.forEach(function(i){j[i]=1});localStorage.setItem(READ_KEY,JSON.stringify(j))}catch(e){}

function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function notifs(){
  var out=[];
  if(!S.ready||S.err)return out;
  var now=new Date(),today=iso(now);
  S.leads.forEach(function(l){
    if(l.stage!=='Closing'&&l.lastDate){
      var d=daysBetween(l.lastDate,today);
      if(d>=7)out.push({id:'stale:'+l.id+':'+l.lastDate,kind:'warn',tag:'Follow up',title:l.company,text:'Belum dihubungi '+d+' hari · tahap '+l.stage,leadId:l.id,rank:2,sort:d});
    }
    if(l.enteredAt===today)out.push({id:'new:'+l.id,kind:'info',tag:'Lead baru',title:l.company,text:l.produk+' masuk hari ini'+(l.source?' · '+l.source:''),leadId:l.id,rank:1,sort:0});
  });
  S.acts.forEach(function(a){
    if(a.date===today&&a.stage==='Closing')out.push({id:'deal:'+a.id,kind:'ok',tag:'Closing',title:a.company,text:a.type+' hari ini'+(a.note?' · '+a.note:''),leadId:a.leadId,rank:1,sort:0});
  });
  var dow=now.getDay();
  if(dow===0||dow>=4){
    var ws=iso(mondayOf(now)),we=iso(addDays(mondayOf(now),6));
    var pw=S.acts.filter(function(a){return a.date>=ws&&a.date<=we&&a.type==='Penawaran'}).length;
    if(!pw)out.push({id:'noq:'+ws,kind:'warn',tag:'Pengingat',title:'Belum ada penawaran dikirim minggu ini',text:'Cek lead di tahap Kunjungan & demo untuk dikirimi penawaran.',view:'pipeline',rank:2,sort:0});
  }
  out.sort(function(a,b){return b.rank-a.rank||b.sort-a.sort});
  return out.slice(0,40);
}
function unreadCount(){var r=readSet();return notifs().filter(function(n){return !r[n.id]}).length}
function initials(n){var p=String(n||'').trim().split(/\s+/);return ((p[0]||'?').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toUpperCase()}

function leadCard(l){
  var hot=l.lastDate&&l.lastDate>=iso(S.week)&&l.lastDate<=iso(addDays(S.week,6));
  var chips='<span class="chip '+chipClass(l.produk)+'">'+esc(l.produk)+'</span>';

function pipeline(){

function reportModel(){
  var r=S.range,a,b,sub;
  if(r==='minggu'){var rr=weekRange(S.week);a=rr[0];b=rr[1];sub=weekLabel(S.week)}
  else if(r==='bulan'){var d=addDays(S.week,3);a=iso(new Date(d.getFullYear(),d.getMonth(),1));b=iso(new Date(d.getFullYear(),d.getMonth()+1,0));sub=MONTHS_L[d.getMonth()]+' '+d.getFullYear()}
  else{a='0000-01-01';b='9999-12-31';sub='Semua periode'}
  var c=calc([a,b],segOk);
  var tiles=[['Aktivitas',c.aktivitas,c.aktivitas],['Perusahaan dihubungi',c.perusahaan,c.perusahaan],['Kunjungan & demo',c.kd,c.kd],['Penawaran dikirim',c.pw,c.pw],['Lead baru',c.lb,c.lb],['Nilai penawaran & negosiasi',rpStat(c.nilai),c.nilai]];
  var opener=r==='semua'?'Sepanjang periode yang tercatat':'Pada periode '+sub;
  var narrative=opener+', tim marketing mencatat '+c.aktivitas+' aktivitas ke '+c.perusahaan+' perusahaan, termasuk '+c.kd+' kunjungan/demo dan '+c.pw+' penawaran. Lead baru yang masuk: '+c.lb+'. Nilai penawaran dan negosiasi yang berjalan: '+rpStat(c.nilai)+'.';
  var segRows=PRODUCTS.filter(segOk).map(function(p){var x=calc([a,b],function(q){return q===p});return {name:p,aktivitas:x.aktivitas,perusahaan:x.perusahaan,lb:x.lb,nilai:x.nilai}});
  var stageRows=STAGES.map(function(st){var ls=S.leads.filter(function(l){return segOk(l.produk)&&l.stage===st});return {name:st,jumlah:ls.length,nilai:ls.reduce(function(s,l){return s+(+l.value||0)},0)}});
  return {by:S.me.name+' ('+S.me.role+')',a:a,b:b,range:r,title:'Executive Summary Sales Pipeline',company:'PT EasyGo Indonesia',sub:sub,seg:segLabel(),tiles:tiles,narrative:narrative,segRows:segRows,stageRows:stageRows,acts:sortActs(c.acts),c:c};
}

/* ---------- saves ---------- */
async function saveLead(f){
  var id=f.id.value||newId('l');
  var old=S.leads.filter(function(l){return l.id===id})[0]||{};
  var produk=f.produk.value;
  var rec=Object.assign({},old,{
    company:f.company.value.trim(),produk:produk,kompetitor:produk==='Kompetitor'?f.kompetitor.value.trim():'',
    sector:f.sector.value.trim(),pic:f.pic.value.trim(),role:f.role.value.trim(),wa:f.wa.value.trim(),
    units:parseFloat(String(f.units.value).replace(',','.'))||0,value:parseFloat(String(f.value.value).replace(',','.'))||0,
    source:f.source.value,enteredAt:f.enteredAt.value,stage:f.stage.value,
    channel:old.channel||'Lead baru',lastDate:old.lastDate||f.enteredAt.value,ts:old.ts||Date.now(),by:old.by||S.me.name
  });
  if(!rec.company){toast('Nama perusahaan wajib diisi.');return}
  var go=putDoc('leads',id,rec);
  if(P.mode==='gas'){closeSheet();toast('Menyimpan…');go.then(function(){toast('Lead tersimpan.')},writeFail);return}
  try{await go;closeSheet();toast('Lead tersimpan.')}catch(e){writeFail(e)}
}
async function saveAct(f){
  var id=f.id.value||newId('a');var isNew=!f.id.value;
  var lead=S.leads.filter(function(l){return l.id===f.leadId.value})[0];
  if(!lead){toast('Pilih perusahaan dulu.');return}
  var old=S.acts.filter(function(x){return x.id===id})[0]||{};
  var rec=Object.assign({},old,{date:f.date.value,company:lead.company,leadId:lead.id,type:f.type.value,produk:lead.produk,stage:f.stage.value,note:f.note.value.trim(),ts:old.ts||Date.now(),by:old.by||S.me.name});
  var work=(async function(){
    await putDoc('activities',id,rec);
    if(isNew){
      var upd=Object.assign({},lead,{stage:rec.stage,channel:rec.type});
      if(!lead.lastDate||rec.date>=lead.lastDate)upd.lastDate=rec.date;
      await putDoc('leads',lead.id,upd);
    }
  })();
  if(P.mode==='gas'){closeSheet();toast('Menyimpan…');work.then(function(){toast('Aktivitas tersimpan.')},writeFail);return}
  try{await work;closeSheet();toast('Aktivitas tersimpan.')}catch(e){writeFail(e)}
}
var askTimer=null;

  }catch(e){writeFail(e)}
}

  L.push('RINGKASAN');m.tiles.forEach(function(t){L.push(t[0]+': '+t[1])});L.push('');L.push(m.narrative);L.push('');
  if(m.segRows.length){L.push('PER SEGMEN');m.segRows.forEach(function(r){L.push(r.name+': '+r.aktivitas+' aktivitas, '+r.perusahaan+' perusahaan, '+r.lb+' lead baru, '+rpStat(r.nilai))});L.push('')}
  L.push('PIPELINE PER TAHAP (posisi saat ini)');m.stageRows.forEach(function(r){L.push(r.name+': '+r.jumlah+' lead, '+rpStat(r.nilai))});L.push('');
  L.push('DETAIL AKTIVITAS');
  if(!m.acts.length)L.push('Tidak ada aktivitas pada periode ini.');
  m.acts.forEach(function(a){L.push(dShort(a.date)+' | '+a.company+' | '+a.type+' | '+a.produk+(a.stage?' | '+a.stage:'')+(a.note?' | '+a.note:''))});
  return L.join('\n');
}
function reportTsv(m){
  var rows=[['Tanggal','Perusahaan','Jenis','Produk','Tahap','Catatan']];
  m.acts.forEach(function(a){rows.push([a.date,a.company,a.type,a.produk,a.stage||'',a.note||''])});
  return rows.map(function(r){return r.map(function(c){return String(c).replace(/[\t\r\n]+/g,' ')}).join('\t')}).join('\n');
}
function copyText(txt){
  return new Promise(function(res){
    function fallback(){
      try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);res(!!ok)}catch(e){res(false)}
    }
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){res(true)},fallback)}else fallback()}catch(e){fallback()}
  });
}

function p(s){return String(s==null?'':s).replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"')}
async function exportPdf(){
  toast('Menyiapkan PDF…');
  try{await loadScript(JSPDF_URL);await loadScript(AUTOTABLE_URL)}catch(e){toast('Pustaka PDF gagal dimuat. Periksa koneksi.');return}
  var m=reportModel();var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF({unit:'mm',format:'a4'});
  var W=doc.internal.pageSize.getWidth();var L=16,R=W-16;var y=14;
  var lw=46,lh=lw/LOGO_RATIO;
  doc.addImage(LOGO,'PNG',L,y,lw,lh);
  y+=lh+10;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(27,30,37);doc.text(p(m.title),L,y);
  y+=7;doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(91,98,115);
  doc.text(p(m.company+'  |  '+m.sub+'  |  '+m.seg),L,y);
  y+=5.5;doc.setFontSize(9.5);doc.text(p('Disusun oleh '+m.by),L,y);
  y+=8;
  var head={fillColor:[242,106,14],textColor:255,fontStyle:'bold'};
  doc.autoTable({startY:y,head:[['Indikator','Nilai']],body:m.tiles.map(function(t){return [p(t[0]),p(t[1])]}),theme:'grid',headStyles:head,styles:{fontSize:10,cellPadding:2.4,textColor:[27,30,37]},columnStyles:{1:{halign:'right',fontStyle:'bold'}},margin:{left:L,right:W-R}});
  y=doc.lastAutoTable.finalY+7;
  doc.setFontSize(10.5);doc.setTextColor(27,30,37);
  var lines=doc.splitTextToSize(p(m.narrative),R-L);doc.text(lines,L,y);y+=lines.length*5+4;
  if(m.segRows.length){
    doc.autoTable({startY:y,head:[['Segmen','Aktivitas','Perusahaan','Lead baru','Nilai']],body:m.segRows.map(function(r){return [r.name,r.aktivitas,r.perusahaan,r.lb,p(rpStat(r.nilai))]}),theme:'striped',headStyles:head,styles:{fontSize:9.5,cellPadding:2.2},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}},margin:{left:L,right:W-R}});
    y=doc.lastAutoTable.finalY+7;
  }
  doc.autoTable({startY:y,head:[['Tahap pipeline (posisi saat ini)','Jumlah lead','Nilai']],body:m.stageRows.map(function(r){return [r.name,r.jumlah,p(rpStat(r.nilai))]}),theme:'striped',headStyles:head,styles:{fontSize:9.5,cellPadding:2.2},columnStyles:{1:{halign:'right'},2:{halign:'right'}},margin:{left:L,right:W-R}});
  y=doc.lastAutoTable.finalY+7;
  doc.autoTable({startY:y,head:[['Tanggal','Perusahaan','Jenis','Produk','Tahap','Catatan']],body:m.acts.length?m.acts.map(function(a){return [dShort(a.date),p(a.company),a.type,a.produk,a.stage||'',p(a.note||'')]}):[['','Tidak ada aktivitas pada periode ini.','','','','']],theme:'striped',headStyles:head,styles:{fontSize:8.5,cellPadding:2,overflow:'linebreak'},columnStyles:{0:{cellWidth:18},1:{cellWidth:42},5:{cellWidth:'auto'}},margin:{left:L,right:W-R}});
  var n=doc.internal.getNumberOfPages();var t=new Date();
  for(var i=1;i<=n;i++){
    doc.setPage(i);doc.setFontSize(8);doc.setTextColor(138,145,162);
    var H=doc.internal.pageSize.getHeight();
    doc.text('PT EasyGo Indonesia  |  Dicetak '+t.getDate()+' '+MONTHS[t.getMonth()]+' '+t.getFullYear(),L,H-8);
    doc.text('Halaman '+i+' dari '+n,R,H-8,{align:'right'});
  }
  await saveFile('EasyGo_Pipeline_'+fileStamp(m)+'.pdf',doc.output('arraybuffer'));
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(e.target.id==='overlay'){closeSheet();return}
  if(!el)return;
  var act=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  if(act==='go'){go(v)}
  else if(act==='week'){var n=+v;S.week=n===0?mondayOf(new Date()):addDays(S.week,7*n);render()}
  else if(act==='seg'){S.seg=v;if(v!=='tms')S.sub='all';render()}
  else if(act==='sub'){S.sub=v;render()}
  else if(act==='range'){S.range=v;render()}
  else if(act==='fab'){openSheet('<h3>Tambah data</h3><div class="choice"><button type="button" class="btn" data-act="new-lead">+ Lead baru</button><button type="button" class="btn" data-act="new-act">✎ Aktivitas baru</button></div><div class="sheet-actions"><button type="button" class="btn" data-act="close">Tutup</button></div>')}
  else if(act==='new-lead'){openSheet(leadForm())}
  else if(act==='new-act'){openSheet(actForm(null,id))}
  else if(act==='open-lead'){var l=S.leads.filter(function(x){return x.id===id})[0];if(l)openSheet(leadForm(l))}
  else if(act==='edit-act'){var a=S.acts.filter(function(x){return x.id===id})[0];if(a)openSheet(actForm(a))}
  else if(act==='del-act'){e.stopPropagation();askDelete(id)}
  else if(act==='del-lead'){deleteLead(id,el)}
  else if(act==='close'){closeSheet()}
  else if(act==='notif'){openNotif()}
  else if(act==='notif-readall'){markRead(notifs().map(function(n){return n.id}));openNotif();renderTop()}
  else if(act==='notif-go'){
    var nn=notifs().filter(function(x){return x.id===id})[0];
    if(nn){
      markRead([nn.id]);closeSheet();
      var ld=nn.leadId&&S.leads.filter(function(x){return x.id===nn.leadId})[0];
      if(ld){renderTop();openSheet(leadForm(ld))}
      else if(nn.view){go(nn.view)}
      else renderTop();
    }
  }
  else if(act==='account'){openAccount(false)}
  else if(act==='logout'){doLogout()}
  else if(act==='retry'){S.auth='loading';S.ready=false;render();P.start(H)}
  else if(act==='export'){
    if(v==='xlsx')exportXlsx();
    else if(v==='pdf')exportPdf();
    else if(v==='copy'){copyText(reportText(reportModel())).then(function(ok){toast(ok?'Laporan disalin ke clipboard.':'Gagal menyalin. Salin manual dari laporan di layar.')})}
    else if(v==='gsheet'&&P.reportSheet){makeReportSheet()}
    else if(v==='gsheet'){copyText(reportTsv(reportModel())).then(function(ok){toast(ok?'Data aktivitas disalin. Tempel di sel A1 pada Google Sheet baru.':'Gagal menyalin data aktivitas.')})}
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('overlay').hidden)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('arow')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var el=$('lead-list');if(el)el.innerHTML=leadListHtml()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-produk'){$('komp-wrap').hidden=t.value!=='Kompetitor'}
  if(t.id==='a-lead'){var l=S.leads.filter(function(x){return x.id===t.value})[0];if(l)$('a-stage').value=l.stage||'Prospek'}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  /* getAttribute: pada <form> yang punya input bernama "id", properti .id mengembalikan input, bukan teks */
  var fid=e.target.getAttribute('id');
  if(fid==='lead-form')saveLead(e.target);
  else if(fid==='act-form')saveAct(e.target);
  else if(fid==='me-form')saveMe(e.target);
  else if(fid==='login-form')doLogin(e.target);
});
window.addEventListener('hashchange',onHash);

onHash();
P.start(H);
})();
